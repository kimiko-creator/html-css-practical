<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyProfile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>MyProfile</h1>

  <nav>
    <a href="#about">About</a>
    <a href="#works">Works</a>
  </nav>
</header>
<main>
  <div class="main-visual">
    <img src="images/main.png" alt="カメラの写真">
  </div>
  <section id="about">
  <h2>About</h2>

  <div class="about-content">
    <img src="images/about.png" alt="プロフィール写真">

    <div class="about-text">
  <h3>Kazuki Asahina</h3>
  <ul>
    <li>25歳 長野県佐久市出身</li>
    <li>ソフトウェア業界でマーケティング部に従事</li>
    <li>趣味はカメラ、愛機はCanon</li>
    <li>自然を撮影するのが好きで、海や山によく行く</li>
  </ul>
  </div>
  </div>
</section>
<section id="works">
  <h2>Works</h2>

  <div class="works-content">
    <div class="work-item">
      <img src="images/works1.png" alt="海の写真">
      <p>新潟に訪れた際に、日本海の雄大さに魅了されて撮影した1枚</p>
    </div>

    <div class="work-item">
      <img src="images/works2.png" alt="雪山の写真">
      <p>地元長野の木曽町から撮影した、冠雪した御嶽山</p>
    </div>

    <div class="work-item">
      <img src="images/works3.png" alt="街並みの写真">
      <p>京都で撮影した、奥行きのある古き良き日本の街並み</p>
    </div>
  </div>
</section>
  </main>
<footer>
  <p>© MyProfile. All rights reserved.</p>
</footer>
</body>
</html>
